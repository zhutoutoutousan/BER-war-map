<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#06080c" />
    <title>BER+ Hub — Offline</title>
    <style>
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        background: radial-gradient(1200px 700px at 30% 10%, rgba(33, 58, 122, 0.35), transparent 60%),
          radial-gradient(900px 600px at 80% 40%, rgba(18, 180, 165, 0.18), transparent 55%),
          linear-gradient(180deg, #06080c, #070b12);
        color: rgba(255, 255, 255, 0.9);
      }
      .wrap {
        max-width: 820px;
        margin: 0 auto;
        padding: 36px 16px;
      }
      .panel {
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.06);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06), 0 12px 40px rgba(0, 0, 0, 0.55);
        padding: 18px;
      }
      a,
      button.link {
        color: rgba(125, 211, 252, 0.95);
        background: none;
        border: none;
        font: inherit;
        cursor: pointer;
        text-decoration: underline;
        padding: 0;
      }
      .actions {
        margin-top: 14px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        font-size: 14px;
      }
    </style>
    <script>
      (function () {
        var isLocal = /localhost|127\.0\.0\.1|\[::1\]/.test(location.hostname);
        if (!isLocal) return;
        (async function () {
          try {
            if ("serviceWorker" in navigator) {
              var regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map(function (r) { return r.unregister(); }));
            }
            if ("caches" in window) {
              var keys = await caches.keys();
              await Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }
          } catch (e) {}
          if (navigator.onLine) {
            location.replace("http://localhost:3001/");
          }
        })();
      })();
    </script>
  </head>
  <body>
    <div class="wrap">
      <div class="panel">
        <h1 style="margin: 0 0 10px 0; font-size: 18px">Offline</h1>
        <p style="margin: 0; opacity: 0.82">
          You’re offline. The app shell is cached, but live map tiles and RSS fetch need a connection.
        </p>
        <p style="margin: 12px 0 0 0; opacity: 0.72">
          Developing locally? Run <code>npm run dev</code> and open
          <a href="http://localhost:3001/">http://localhost:3001</a> (not port 3000).
        </p>
        <div class="actions">
          <a href="/">Reload</a>
          <button type="button" class="link" id="clear-sw">Clear cached app &amp; reload</button>
        </div>
      </div>
    </div>
    <script>
      document.getElementById("clear-sw").addEventListener("click", async () => {
        try {
          if ("serviceWorker" in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map((r) => r.unregister()));
          }
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.filter((k) => k.startsWith("ber-hub")).map((k) => caches.delete(k)));
          }
        } catch (e) {
          console.warn(e);
        }
        window.location.href = "http://localhost:3001/";
      });
    </script>
  </body>
</html>
